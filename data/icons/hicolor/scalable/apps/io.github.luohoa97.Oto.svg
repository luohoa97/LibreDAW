<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c9a"/>
      <stop offset="1" stop-color="#2d2b55"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
  </defs>
  <rect x="10" y="14" width="108" height="104" rx="22" fill="#000" opacity=".18"/>
  <rect x="10" y="10" width="108" height="108" rx="22" fill="url(#body)"/>
  <rect x="10.5" y="10.5" width="107" height="107" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".2"/>
  <!-- step pads: lit pads are active steps in a sequencer -->
  <rect x="22" y="24" width="20" height="20" rx="5" fill="url(#lit)"/>
  <rect x="46" y="24" width="20" height="20" rx="5" fill="#fff" fill-opacity=".16"/>
  <rect x="70" y="24" width="20" height="20" rx="5" fill="url(#lit)"/>
  <rect x="94" y="24" width="12" height="20" rx="5" fill="#fff" fill-opacity=".16"/>
  <rect x="22" y="50" width="20" height="20" rx="5" fill="#fff" fill-opacity=".16"/>
  <rect x="46" y="50" width="20" height="20" rx="5" fill="url(#lit)"/>
  <rect x="70" y="50" width="20" height="20" rx="5" fill="#fff" fill-opacity=".16"/>
  <rect x="94" y="50" width="12" height="20" rx="5" fill="url(#lit)"/>
  <!-- waveform strip -->
  <g fill="#f6f5f4">
    <rect x="22" y="94" width="6" height="8" rx="3"/>
    <rect x="32" y="86" width="6" height="24" rx="3"/>
    <rect x="42" y="78" width="6" height="40" rx="3"/>
    <rect x="52" y="82" width="6" height="32" rx="3"/>
    <rect x="62" y="90" width="6" height="16" rx="3"/>
    <rect x="72" y="84" width="6" height="28" rx="3"/>
    <rect x="82" y="88" width="6" height="20" rx="3"/>
    <rect x="92" y="93" width="6" height="10" rx="3"/>
    <rect x="102" y="96" width="4" height="4" rx="2"/>
  </g>
</svg>
