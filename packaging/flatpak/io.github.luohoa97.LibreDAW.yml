# LibreDAW Flatpak manifest (SPEC.md section 19.3).
# Generate the offline Cargo sources first:
#   fish packaging/flatpak/cargo-sources.fish
# Build:
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     build-dir packaging/flatpak/io.github.luohoa97.LibreDAW.yml
app-id: io.github.luohoa97.LibreDAW
# GNOME 50 ships libadwaita 1.9 (>= 1.5) and is built on Freedesktop 25.08,
# so the Rust and LLVM SDK extensions and the LinuxAudio plugin extension
# point all use branch 25.08.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20 # libclang for bindgen (clang-sys)
command: libredaw

finish-args:
  # Flatpak 1.18 rejects --socket=pipewire; use the PipeWire socket path.
  # TODO: switch to --socket=pipewire when the minimum Flatpak supports it.
  - --filesystem=xdg-run/pipewire-0
  - --socket=wayland
  - --socket=fallback-x11 # also needed for plugin windows (SPEC 9.2)
  - --share=ipc
  - --device=dri
  # Real-time priority: RealtimeKit lives on the system bus; the session talk
  # name is kept for the realtime portal. See packaging/flatpak/README.md.
  - --talk-name=org.freedesktop.RealtimeKit1
  - --system-talk-name=org.freedesktop.RealtimeKit1
  - --filesystem=xdg-music
  - --filesystem=~/.clap:ro
  - --env=CLAP_PATH=/app/extensions/Plugins/clap
  # Agents: the control socket lives in the app's runtime dir ($XDG_RUNTIME_DIR/app/<id>),
  # which is private to the app and reachable via `flatpak run --command=libredaw-mcp`.

# Flatpak Linux audio plugin extension point: plugin packs such as
# org.freedesktop.LinuxAudio.Plugins.* mount under /app/extensions/Plugins.
add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '25.08'
    add-ld-path: lib
    merge-directories: lib/ladspa;lib/lv2;lib/vst;lib/vst3;lib/clap
    subdirectories: true
    no-autodownload: true
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/extensions/Plugins

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  env:
    CARGO_HOME: /run/build/libredaw/cargo
    CARGO_INCREMENTAL: '0'
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib

modules:
  # Built-in sound packs, CC0-1.0, a separate repository (SPEC 15.3, 19.3).
  # TODO(release): replace the local dir with a public git URL and tag.
  - name: libredaw-sounds
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/libredaw/sounds
      - cp -r packs/. /app/share/libredaw/sounds/
      - install -Dm644 LICENSES/CC0-1.0.txt /app/share/licenses/io.github.luohoa97.LibreDAW/sounds-CC0-1.0.txt
    sources:
      - type: dir
        path: /var/home/neilluo/Projects/libredaw-sounds
        skip: [target, .git]

  - name: libredaw
    buildsystem: simple
    build-options:
      # The jack-sys build script needs a "jack" pkg-config entry; the
      # repository ships a stub (libjack is dlopened at run time).
      env:
        PKG_CONFIG_PATH: /run/build/libredaw/tools/pkgconfig
    build-commands:
      - cargo --offline build --release -p libredaw-ui -p libredaw-mcp
      - install -Dm755 target/release/libredaw /app/bin/libredaw
      - install -Dm755 target/release/libredaw-mcp /app/bin/libredaw-mcp
      - install -Dm644 data/io.github.luohoa97.LibreDAW.desktop /app/share/applications/io.github.luohoa97.LibreDAW.desktop
      - install -Dm644 data/io.github.luohoa97.LibreDAW.metainfo.xml /app/share/metainfo/io.github.luohoa97.LibreDAW.metainfo.xml
      - install -Dm644 data/io.github.luohoa97.LibreDAW.xml /app/share/mime/packages/io.github.luohoa97.LibreDAW.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.luohoa97.LibreDAW.svg /app/share/icons/hicolor/scalable/apps/io.github.luohoa97.LibreDAW.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.luohoa97.LibreDAW-symbolic.svg /app/share/icons/hicolor/symbolic/apps/io.github.luohoa97.LibreDAW-symbolic.svg
      - install -Dm644 data/help/index.html /app/share/help/C/libredaw/index.html
      - install -Dm644 LICENSE /app/share/licenses/io.github.luohoa97.LibreDAW/LICENSE
      - install -Dm644 THIRD_PARTY.md /app/share/licenses/io.github.luohoa97.LibreDAW/THIRD_PARTY.md
    sources:
      - type: dir
        path: ../..
        skip: [target, .git, .claude, packaging/flatpak/build-dir, packaging/flatpak/.flatpak-builder]
      # Generated by cargo-sources.fish from Cargo.lock.
      - cargo-sources.json
