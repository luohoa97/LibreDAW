# SPDX-License-Identifier: GPL-3.0-or-later
# Dependency policy, SPEC.md section 12.1.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
# SPDX ids as cargo-deny matches them literally. New ids are added only when
# `cargo deny list` shows a real dependency needs them, after review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# Our own crates are GPL-3.0-or-later and `publish = false`. GPL is not on the
# allow list, so any third-party GPL crate needs a named, reviewed exception.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates use path dependencies between each other (all publish = false).
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
# All three come only through tract-onnx (build dependency liquid, used by tract-linalg
# to generate assembly; paste as a macro helper). No runtime parsing of untrusted
# input. Revisit when tract or the toolchain moves on.
ignore = [
    { id = "RUSTSEC-2026-0319", reason = "anymap2 unmaintained; build-time only, via tract-linalg build dependency liquid-core" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc-macro helper used by tract-core, no runtime effect" },
    { id = "RUSTSEC-2026-0009", reason = "time RFC 2822 stack exhaustion; time is a build-time dependency of liquid-core and never parses input; tract-linalg 0.21 pins time below 0.3.42, the fix is in 0.3.47" },
]
