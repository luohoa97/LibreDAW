# SPDX-License-Identifier: GPL-3.0-or-later
# Dependency policy, SPEC.md section 12.1.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
# SPDX ids as cargo-deny matches them literally. New ids are added only when
# `cargo deny list` shows a real dependency needs them, after review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# Our own crates are GPL-3.0-or-later and `publish = false`. GPL is not on the
# allow list, so any third-party GPL crate needs a named, reviewed exception.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
