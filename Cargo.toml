# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/engine",
    "crates/plugin-host",
    "crates/ui",
    "crates/script",
    "crates/mcp",
    "crates/control",
    "crates/doc",
    "crates/library",
    "crates/audiofile",
    "crates/transcribe",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# tract's debug assertions reject a fact its own optimizer produces for the
# Basic Pitch model (crates/transcribe); release builds are unaffected.
[profile.dev.package.tract-core]
debug-assertions = false
