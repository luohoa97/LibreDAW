# SPDX-License-Identifier: GPL-3.0-or-later
#
# Beginner instrument list for the Add Instrument picker (SPEC 15). Every entry
# is a libre CLAP plugin plus a factory preset. `preset` is a path under the
# plugin's `preset_root`, which is relative to the extension root (the parent of
# the directory holding the .clap file). `note` is the MIDI key used to audition
# and to test-render the entry (60 is C4, 48 is C3). `gain_db` (optional) turns
# the new track down for a preset that peaks above full scale.

[[plugin]]
key = "surge-xt"
name = "Surge XT"
clap_id = "org.surge-synth-team.surge-xt"
extension = "org.freedesktop.LinuxAudio.Plugins.Surge-XT"
preset_root = "share/surge-xt/patches_factory"
preset_load = "clap.preset-load"

