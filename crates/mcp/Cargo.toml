# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "libredaw-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mcp"
path = "src/lib.rs"

[[bin]]
name = "libredaw-mcp"
path = "src/main.rs"

[dependencies]
# The control socket speaks MCP itself (SPEC 18.3); the relay only needs
# its socket location and the pinned protocol revision.
libredaw-control = { path = "../control" }
# JSON-RPC errors from the relay and config edits in `setup`. preserve_order keeps key order when `setup` edits client config files.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Fake UI types for the end-to-end tests through the real control server.
libredaw-protocol = { path = "../protocol" }
