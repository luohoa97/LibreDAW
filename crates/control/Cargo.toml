# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "libredaw-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "control"

[dependencies]
libredaw-protocol = { path = "../protocol" }
# The beginner instrument list (roles and factory sounds), data only.
libredaw-plugin-host = { path = "../plugin-host" }
# JSON lines on the control socket (SPEC 16.2, 17.1).
serde_json = "1"
# Typed tool arguments and suggestion kinds.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The existing control socket client, used to drive the server in tests.
libredaw-script = { path = "../script" }
# The real document and change tree behind the reference bridge in the
# end-to-end tests (tests/support), so tool calls run against real apply().
libredaw-doc = { path = "../doc" }
